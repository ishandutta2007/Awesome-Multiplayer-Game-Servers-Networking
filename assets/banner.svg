<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      .glow-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 17px;
        fill: #94a3b8;
      }

      /* Animated Network Packets */
      @keyframes floatPacket1 {
        0% { cx: 120px; cy: 70px; opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { cx: 480px; cy: 110px; opacity: 0; }
      }
      @keyframes floatPacket2 {
        0% { cx: 480px; cy: 110px; opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { cx: 1080px; cy: 80px; opacity: 0; }
      }
      @keyframes floatPacket3 {
        0% { cx: 1080px; cy: 80px; opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { cx: 750px; cy: 300px; opacity: 0; }
      }
      @keyframes pulseServer {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      .packet1 { animation: floatPacket1 4s linear infinite; }
      .packet2 { animation: floatPacket2 3.5s linear infinite 1.2s; }
      .packet3 { animation: floatPacket3 4.2s linear infinite 0.7s; }
      .server-node { transform-origin: center; animation: pulseServer 3s ease-in-out infinite; }
      .bg-orb { animation: pulseOrb 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Tech Grid Background -->
  <rect width="1200" height="360" fill="url(#gridPattern)" rx="16"/>

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="bg-orb" cx="200" cy="80" r="140" fill="#0284c7" opacity="0.18" filter="blur(50px)"/>
  <circle class="bg-orb" cx="1020" cy="180" r="160" fill="#7c3aed" opacity="0.16" filter="blur(60px)"/>
  <circle class="bg-orb" cx="600" cy="320" r="120" fill="#059669" opacity="0.12" filter="blur(45px)"/>

  <!-- Background Topology / Network Mesh Lines (Behind text) -->
  <g stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45">
    <line x1="120" y1="70" x2="480" y2="110" />
    <line x1="480" y1="110" x2="1080" y2="80" />
    <line x1="1080" y1="80" x2="980" y2="290" />
    <line x1="980" y1="290" x2="520" y2="310" />
    <line x1="520" y1="310" x2="160" y2="280" />
    <line x1="160" y1="280" x2="120" y2="70" />
    <line x1="480" y1="110" x2="520" y2="310" />
    <line x1="480" y1="110" x2="980" y2="290" />
  </g>

  <!-- Network Nodes -->
  <circle cx="120" cy="70" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="480" cy="110" r="5" fill="#a855f7" opacity="0.7"/>
  <circle cx="1080" cy="80" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="980" cy="290" r="5" fill="#34d399" opacity="0.7"/>
  <circle cx="520" cy="310" r="4" fill="#818cf8" opacity="0.7"/>
  <circle cx="160" cy="280" r="4" fill="#f472b6" opacity="0.7"/>

  <!-- Dynamic Flying Packets -->
  <circle class="packet1" cx="120" cy="70" r="4.5" fill="#38bdf8" filter="drop-shadow(0 0 6px #0ea5e9)"/>
  <circle class="packet2" cx="480" cy="110" r="4.5" fill="#ec4899" filter="drop-shadow(0 0 6px #ec4899)"/>
  <circle class="packet3" cx="1080" cy="80" r="4.5" fill="#34d399" filter="drop-shadow(0 0 6px #10b981)"/>

  <!-- Foreground Foreground Container / Header Content -->
  <g transform="translate(80, 55)">
    <!-- Top Micro Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="365" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="5" fill="#10b981" />
      <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED MULTIPLAYER TECH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" class="glow-title" font-size="44" fill="#ffffff">
      Awesome Multiplayer Game Servers
    </text>
    <text x="0" y="126" class="glow-title" font-size="34" fill="url(#cyberCyan)">
      &amp; Real-Time Networking
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text">
      Authoritative Game Servers • Low-Latency UDP • Rollback Netcode • Dedicated Server Autoscaling
    </text>

    <!-- Tech Feature Pills in Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95"/>
        <text x="90" y="22" text-anchor="middle" class="badge-text" fill="#93c5fd">⚡ Reliable UDP &amp; QUIC</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95"/>
        <text x="90" y="22" text-anchor="middle" class="badge-text" fill="#c4b5fd">🎮 Rollback Netcode</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(384, 0)">
        <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.95"/>
        <text x="95" y="22" text-anchor="middle" class="badge-text" fill="#67e8f9">🌐 Authoritative Rooms</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(586, 0)">
        <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
        <text x="105" y="22" text-anchor="middle" class="badge-text" fill="#6ee7b7">☸️ Agones &amp; Fleet Scaling</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(808, 0)">
        <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" opacity="0.95"/>
        <text x="80" y="22" text-anchor="middle" class="badge-text" fill="#fda4af">🎯 Matchmaking</text>
      </g>
    </g>
  </g>
</svg>
